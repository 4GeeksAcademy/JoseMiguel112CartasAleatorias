<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RandomCards</title>

    <!-- Fontawesome is our recomended library for icons -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Write your HTML code here, you can delete everything withing the body tags -->
    <div class="container text-center">
      <div class="row d-flex justify-content-center m-7">
        <div class="col-7 col-lg-3 col-md-6 col-sm-7 bg-white p-6 m-4 rounded h-100" id="card">
          <div class="row mt-3 h-25" id="top">
            <p class="fs-1 text text-start fw-bold" id="topP"></p>
          </div>
          <div class="row my-5 h-25" id="center">
            <p class="fs-1 text text-center fw-bold p-5">C</p>
          </div>
          <div class="row mb-3 h-25" id="bottom">
            <p class="fs-1 text text-end fw-bold"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
